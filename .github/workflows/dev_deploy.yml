name: VERBLY CI/CD

on:
  push:
    branches: [ dev ] # dev 브랜치에 push가 일어날 때 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # 저장소 코드 체크아웃

      - name: Set up JDK 17 # Java 개발 킷 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle # Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v3

      - name: Make application.yml # application.yml 파일 생성
        run: |
          cd ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./application.yml
        shell: bash

      - name: Grant execute permission for gradlew # gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle # Gradle 빌드 실행
        run: ./gradlew clean build -x test

      - name: Upload build artifact # 빌드된 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: verblyServer
          path: build/libs/*.jar

  deploy:
    needs: build # build 작업이 성공적으로 완료된 후 실행
    runs-on: ubuntu-22.04

    steps:
      - name: Download build artifact # 이전 단계에서 업로드한 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: verblyServer
          path: build/libs/

      - name: Deploy to EC2 # EC2에 배포
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" > verbly-key.pem
          chmod 600 verbly-key.pem
          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)
          scp -i verbly-key.pem -o StrictHostKeyChecking=no "$jar_file" $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/verblyServer.jar
          ssh -i verbly-key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "
            sudo systemctl stop verbly # verbly.service에 정의된 서비스만 종료
            sudo cp /home/$EC2_USERNAME/verblyServer.jar /opt/verbly/verblyServer.jar # 운영 표준 위치로 수정
            sudo systemctl start verbly # systemd가 Java 프로세스 실행
            sudo systemctl status verbly --no-pager # 배포 검증용 서비스 상태 확인
          "
          rm -f verbly-key.pem # 민감한 정보 삭제